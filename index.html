<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expence tracker</title>
<link rel="stylesheet" href="index.css">       
</head>
<body>
    <div>
        <h1>Expence Tracker</h1>
        enter Expence name:
        <input type="text" class="name" placeholder="Expence name">
        enter Expence price:
        <input type="number" class="amount" placeholder="Expence price">
        <button type="submit" class="submit">submit</button>
    </div>
    <div>
        <h1>Expence list</h1>
        <table>
            <tr>
                <td>Expence</td>
                <td>price</td>
                <td>actiont</td>
                
            </tr>
        </table>
        <h2>Total Amount: <span class="total">0</span></h2>
    </div>
    <script src="app.js"></script>
</body>
</html>
